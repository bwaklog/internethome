<script>
const postDates = document.querySelectorAll('.post-list-date, .post-date');
const dateFormatter = new Intl.DateTimeFormat('en-US', {
    month: 'short',
    day: 'numeric',
    year: 'numeric',
    timeZone: 'UTC'
});

postDates.forEach((element) => {
    const date = new Date(element.textContent.trim());
    if (!Number.isNaN(date.getTime())) {
        element.textContent = dateFormatter.format(date);
    }
});
</script>
