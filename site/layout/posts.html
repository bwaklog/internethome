{{ define "posts"}}
{{$PageData := .TemplateData}}
{{ template "head" .}}

<body>
    {{template "header" .}}

    <h1>Posts</h1>

    <ul class="post-list">
        {{range $index, $Post := .DeepDataMerge.Posts}}
        <li class="post-list-element">
            <div class="post-list-content">
                <div class="post-list-date">{{$Post.Frontmatter.Date}}</div>
                <a class="post-list-title" href="/{{ .CompleteURL }}">{{$Post.Frontmatter.Title}}</a>
            </div>
        </li>
        {{end}}
    </ul>

    {{template "footer" .}}
</body>

</html>

{{ end}}
