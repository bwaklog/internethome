{{ define "all-tags"}}
{{$PageData := .PageData}}
{{ template "head" .}}

<body>
    <main class="post-content">
        {{template "header" .}}

        <h1>Site Index</h1>

        <!-- previously a div that had post-tag -->
        <div class="all-tags">
            {{ range .TagNames }}
            <a class="post-tag" href="/tags/{{ . }}.html"><code>{{.}}</code></a>
            {{end}}
        </div>

        <div class="cite-block">
            <p>These posts are also organised by collections, browse the available ones <a href="/collections.html">here</a></p>
        </div>

        {{template "footer" .}}
    </main>
</body>
